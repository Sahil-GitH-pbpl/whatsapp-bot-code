<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group Manager</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef2f5;
      color: #17202a;
    }
    .app {
      height: 100vh;
      max-height: 100vh;
      display: grid;
      grid-template-columns: 430px 1fr;
      overflow: hidden;
    }
    .sidebar {
      background: #fff;
      border-right: 1px solid #d7dde3;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      min-height: 52px;
      padding: 8px 12px;
      background: #075e54;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
    }
    .count {
      font-size: 12px;
      padding: 4px 8px;
      background: rgba(255,255,255,.16);
      border-radius: 999px;
    }
    .search-panel {
      padding: 8px;
      border-bottom: 1px solid #e2e7ec;
      background: #f7f9fa;
    }
    .field-row {
      display: flex;
      gap: 6px;
    }
    input {
      width: 100%;
      height: 34px;
      border: 1px solid #c9d2da;
      border-radius: 6px;
      padding: 0 10px;
      font-size: 13px;
      outline: none;
      background: #fff;
    }
    select {
      height: 34px;
      border: 1px solid #c9d2da;
      border-radius: 6px;
      padding: 0 8px;
      font-size: 13px;
      outline: none;
      background: #fff;
      color: #17202a;
      flex: 0 0 96px;
    }
    input:focus {
      border-color: #128c7e;
      box-shadow: 0 0 0 2px rgba(18,140,126,.14);
    }
    button {
      height: 34px;
      border: 0;
      border-radius: 6px;
      padding: 0 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: #128c7e;
      color: #fff;
      white-space: nowrap;
    }
    button.secondary { background: #e8eef2; color: #1f2d3a; }
    button.danger { background: #d92d20; }
    button.light { background: rgba(255,255,255,.16); color: #fff; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .hint {
      margin-top: 6px;
      font-size: 11px;
      color: #5f6f7d;
      line-height: 1.4;
    }
    .hint input[type="checkbox"] {
      width: 14px;
      height: 14px;
      padding: 0;
      margin: 0 4px 0 0;
      vertical-align: middle;
    }
    .groups {
      overflow-y: scroll;
      flex: 1;
      min-height: 0;
    }
    .group-item {
      width: 100%;
      border: 0;
      border-bottom: 1px solid #edf1f4;
      background: #fff;
      color: #17202a;
      height: auto;
      min-height: 62px;
      padding: 8px 12px;
      display: block;
      text-align: left;
      border-radius: 0;
    }
    .group-item:nth-child(even) { background: #eef4f6; }
    .group-item:hover { background: #f4f7f8; }
    .group-item.active { background: #dff3ef; }
    .group-item.match { border-left: 4px solid #25d366; padding-left: 10px; }
    .group-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }
    .group-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      padding-top: 1px;
    }
    .group-name {
      font-size: 14px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 4px;
    }
    .group-name-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .type-chip {
      flex: 0 0 auto;
      font-size: 10px;
      line-height: 1;
      padding: 4px 6px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #fff;
      background: #667085;
    }
    .type-chip.client { background: #d92d20; }
    .type-chip.internal { background: #475467; }
    .type-chip.vacancy { background: #7a2e83; }
    .type-chip.vendor { background: #b54708; }
    .type-chip.admin { background: #075e54; }
    .type-chip.view { background: #667085; }
    .category-chip { cursor: pointer; }
    .category-chip:hover { filter: brightness(.92); }
    .category-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .category-option {
      height: 36px;
      border: 1px solid #d0d5dd;
      border-radius: 999px;
      justify-content: center;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0;
      background: #fff;
      color: #344054;
    }
    .category-option.selected {
      border-color: #075e54;
      background: #e6f4f1;
      color: #075e54;
      box-shadow: 0 0 0 2px rgba(7, 94, 84, .12);
    }
    .meta-right {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
    }
    .group-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: #687886;
      min-width: 0;
    }
    .group-meta span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: #e7ddd3;
    }
    .chat-head {
      min-height: 52px;
      padding: 8px 12px;
      background: #f0f2f5;
      border-bottom: 1px solid #d7dde3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .selected-title {
      font-size: 16px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .selected-meta {
      margin-top: 3px;
      font-size: 12px;
      color: #657480;
    }
    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      max-width: 440px;
      width: 48%;
    }
    .content {
      flex: 1;
      overflow-y: scroll;
      padding: 8px 10px;
      min-height: 0;
    }
    .empty {
      margin: 70px auto;
      max-width: 420px;
      text-align: center;
      color: #52616d;
      background: rgba(255,255,255,.72);
      padding: 18px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,.06);
    }
    .participant {
      max-width: 520px;
      margin: 0 0 6px auto;
      padding: 8px 10px;
      background: #dcf8c6;
      border-radius: 8px 8px 0 8px;
      box-shadow: 0 1px 1px rgba(0,0,0,.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .participant .tools {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }
    .participant button {
      height: 28px;
      padding: 0 8px;
      font-size: 12px;
    }
    .participant.hit {
      outline: 2px solid #128c7e;
      background: #c8f5d0;
    }
    .number {
      font-family: Consolas, monospace;
      font-size: 14px;
      word-break: break-word;
    }
    .badge {
      display: inline-block;
      margin-left: 8px;
      font-size: 11px;
      background: #075e54;
      color: #fff;
      padding: 2px 6px;
      border-radius: 999px;
    }
    .status {
      min-height: 28px;
      padding: 7px 12px;
      background: #fff;
      border-top: 1px solid #d7dde3;
      font-size: 13px;
      color: #40515f;
      flex: 0 0 auto;
    }
    .status.error { color: #b42318; }
    .status.ok { color: #067647; }
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(17, 24, 39, .42);
      z-index: 20;
      padding: 16px;
    }
    .modal.open { display: flex; }
    .dialog {
      width: min(520px, 100%);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 18px 48px rgba(0,0,0,.24);
      overflow: hidden;
    }
    .dialog.small { width: min(340px, 100%); }
    .dialog-head {
      padding: 12px 14px;
      border-bottom: 1px solid #e2e7ec;
      font-size: 16px;
      font-weight: 800;
    }
    .dialog-body {
      padding: 14px;
      display: grid;
      gap: 10px;
    }
    .dialog-actions {
      padding: 12px 14px;
      border-top: 1px solid #e2e7ec;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .number-list {
      display: grid;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }
    .number-chip {
      min-height: 32px;
      padding: 6px 8px;
      border: 1px solid #d7dde3;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: Consolas, monospace;
      font-size: 13px;
    }
    .number-chip label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      color: #40515f;
    }
    .number-chip input[type="checkbox"] {
      width: 14px;
      height: 14px;
      padding: 0;
    }
    .number-chip button {
      height: 24px;
      padding: 0 8px;
      font-size: 12px;
    }
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { height: 45vh; border-right: 0; border-bottom: 1px solid #d7dde3; }
      .main { height: 55vh; }
      .actions { width: 100%; max-width: none; }
      .chat-head { align-items: stretch; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="topbar">
        <div class="title">Groups</div>
        <div class="top-actions">
          <button class="light" id="makeGroupBtn">Make Group</button>
          <div class="count" id="groupCount">0</div>
        </div>
      </div>
      <div class="search-panel">
        <div class="field-row">
          <input id="searchInput" placeholder="Search number or group">
          <button id="searchBtn">Search</button>
          <select id="groupTypeFilter">
            <option value="all">All</option>
            <option value="client">Client</option>
            <option value="internal">Internal</option>
            <option value="vacancy">Vacancy</option>
            <option value="vendor">Vendor</option>
          </select>
        </div>
        <div class="hint" id="searchHint">Search number or group name, e.g. 9876543210 or official.</div>
      </div>
      <div class="groups" id="groups"></div>
    </aside>

    <main class="main">
      <div class="chat-head">
        <div>
          <div class="selected-title" id="selectedTitle">Select a group</div>
          <div class="selected-meta" id="selectedMeta">Participants will appear here.</div>
        </div>
        <div class="actions">
          <input id="addContactInput" placeholder="Add contact number">
          <button id="addContactBtn">Add</button>
          <input id="groupSearchInput" placeholder="Search in selected group">
          <button class="secondary" id="groupSearchBtn">Search</button>
        </div>
      </div>
      <div class="content" id="participants">
        <div class="empty">Choose a group from the left list.</div>
      </div>
      <div class="status" id="status">Ready</div>
    </main>
  </div>

  <div class="modal" id="createGroupModal">
    <div class="dialog">
      <div class="dialog-head">Make Group</div>
      <div class="dialog-body">
        <input id="createGroupName" placeholder="Group name">
        <div class="field-row">
          <input id="createGroupNumber" placeholder="Mobile number">
          <button id="createGroupAddNumberBtn">+</button>
        </div>
        <label class="hint">
          <input id="createGroupAdminToggle" type="checkbox"> Make this number admin
        </label>
        <div class="number-list" id="createGroupNumbers"></div>
      </div>
      <div class="dialog-actions">
        <button class="secondary" id="createGroupCancelBtn">Cancel</button>
        <button id="createGroupSubmitBtn">Create</button>
      </div>
    </div>
  </div>

  <div class="modal" id="categoryModal">
    <div class="dialog small">
      <div class="dialog-head">Group Category</div>
      <div class="dialog-body">
        <div class="category-options" id="categoryOptions">
          <button class="category-option" data-category="client">Client</button>
          <button class="category-option" data-category="internal">Internal</button>
          <button class="category-option" data-category="vacancy">Vacancy</button>
          <button class="category-option" data-category="vendor">Vendor</button>
        </div>
      </div>
      <div class="dialog-actions">
        <button class="secondary" id="categoryCancelBtn">Cancel</button>
        <button id="categorySaveBtn">Save</button>
      </div>
    </div>
  </div>

  <script>
    const accountId = 1;
    const categoryLabels = {
      client: 'Client',
      internal: 'Internal',
      vacancy: 'Vacancy',
      vendor: 'Vendor'
    };
    let groups = [];
    let selectedGroup = null;
    let selectedParticipants = [];
    let displayedParticipants = [];
    let activeSearch = '';
    let activeSearchMode = '';
    let activeSearchRaw = '';
    let groupTypeFilter = 'all';
    let selectedGroupSearch = '';
    let createGroupNumbers = [];
    let editingCategoryGroup = null;
    let editingCategoryValue = 'internal';

    const $ = (id) => document.getElementById(id);

    function setStatus(message, type = '') {
      const el = $('status');
      el.textContent = message;
      el.className = `status ${type}`;
    }

    function normalizePhone(value) {
      const digits = String(value || '').replace(/\D+/g, '');
      if (digits.length === 10) return `91${digits}`;
      return digits;
    }

    function groupDisplayId(group) {
      return String(group.id || '').replace(/@g\.us$/i, '');
    }

    function groupHasNumber(group, normalized) {
      if (!normalized) return false;
      return (group.participants || []).some((p) => normalizePhone(p.number) === normalized);
    }

    function groupType(group) {
      const type = String(group.category || 'internal').toLowerCase();
      return categoryLabels[type] ? type : 'internal';
    }

    function groupTypeLabel(group) {
      return categoryLabels[groupType(group)] || 'Internal';
    }

    function filterGroupsByType(items) {
      if (groupTypeFilter === 'all') return items;
      return items.filter((group) => groupType(group) === groupTypeFilter);
    }

    function groupMatchesText(group, value) {
      const text = String(value || '').trim().toLowerCase();
      if (!text) return false;
      return String(group.name || '').toLowerCase().includes(text)
        || groupDisplayId(group).toLowerCase().includes(text);
    }

    function renderGroups() {
      const list = $('groups');
      let visible = filterGroupsByType(groups);
      if (activeSearchMode === 'number') {
        visible = visible.filter((group) => groupHasNumber(group, activeSearch));
      } else if (activeSearchMode === 'text') {
        const matched = visible.filter((group) => groupMatchesText(group, activeSearchRaw));
        const rest = visible.filter((group) => !groupMatchesText(group, activeSearchRaw));
        visible = [...matched, ...rest];
      }

      $('groupCount').textContent = groupTypeFilter === 'all' ? String(visible.length) : `${visible.length}/${groups.length}`;

      if (!visible.length) {
        list.innerHTML = '<div class="empty">No groups found.</div>';
        return;
      }

      list.innerHTML = visible.map((group) => {
        const active = selectedGroup && selectedGroup.id === group.id ? ' active' : '';
        const match = (activeSearchMode === 'number' && groupHasNumber(group, activeSearch))
          || (activeSearchMode === 'text' && groupMatchesText(group, activeSearchRaw)) ? ' match' : '';
        const type = groupType(group);
        return `
          <button class="group-item${active}${match}" data-id="${encodeURIComponent(group.id)}">
            <div class="group-row">
              <div>
                <div class="group-name">
                  <span class="group-name-text">${escapeHtml(group.name)}</span>
                </div>
                <div class="group-meta">
                  <span>${escapeHtml(groupDisplayId(group))}</span>
                </div>
              </div>
              <div class="group-side">
                <span class="type-chip category-chip ${type}" data-category-id="${encodeURIComponent(group.id)}">${groupTypeLabel(group)}</span>
                <span class="meta-right">
                  <span>${group.participantCount || 0} contacts</span>
                  <span class="type-chip ${group.isAdmin ? 'admin' : 'view'}">${group.isAdmin ? 'Admin' : 'View'}</span>
                </span>
              </div>
            </div>
          </button>
        `;
      }).join('');

      list.querySelectorAll('.group-item').forEach((btn) => {
        btn.addEventListener('click', () => selectGroup(decodeURIComponent(btn.dataset.id)));
      });
      list.querySelectorAll('.category-chip').forEach((chip) => {
        chip.addEventListener('click', (event) => {
          event.stopPropagation();
          openCategoryModal(decodeURIComponent(chip.dataset.categoryId));
        });
      });
    }

    function renderParticipants() {
      const panel = $('participants');
      if (!selectedGroup) {
        panel.innerHTML = '<div class="empty">Choose a group from the left list.</div>';
        return;
      }
      const participantsToRender = displayedParticipants.length || selectedGroupSearch
        ? displayedParticipants
        : selectedParticipants;
      if (!participantsToRender.length) {
        panel.innerHTML = '<div class="empty">No participants loaded.</div>';
        return;
      }

      panel.innerHTML = participantsToRender.map((p) => {
        const hit = (activeSearchMode === 'number' && normalizePhone(p.number) === activeSearch)
          || (selectedGroupSearch && normalizePhone(p.number) === selectedGroupSearch) ? ' hit' : '';
        return `
          <div class="participant${hit}">
            <div class="number">${escapeHtml(p.number)}</div>
            <div class="tools">
              ${p.isAdmin || p.isSuperAdmin ? '<span class="badge">Admin</span>' : ''}
              <button class="danger remove-participant" data-number="${escapeHtml(p.number)}" ${selectedGroup.isAdmin ? '' : 'disabled'}>Remove</button>
            </div>
          </div>
        `;
      }).join('');

      panel.querySelectorAll('.remove-participant').forEach((btn) => {
        btn.addEventListener('click', () => removeParticipant(btn.dataset.number));
      });
    }

    function escapeHtml(value) {
      return String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function openCreateGroupModal() {
      createGroupNumbers = [];
      $('createGroupName').value = '';
      $('createGroupNumber').value = '';
      $('createGroupAdminToggle').checked = false;
      renderCreateGroupNumbers();
      $('createGroupModal').classList.add('open');
      $('createGroupName').focus();
    }

    function closeCreateGroupModal() {
      $('createGroupModal').classList.remove('open');
    }

    function openCategoryModal(groupId) {
      const group = groups.find((item) => item.id === groupId);
      if (!group) return;
      editingCategoryGroup = group;
      editingCategoryValue = groupType(group);
      renderCategoryOptions();
      $('categoryModal').classList.add('open');
    }

    function closeCategoryModal() {
      $('categoryModal').classList.remove('open');
      editingCategoryGroup = null;
    }

    function renderCategoryOptions() {
      document.querySelectorAll('.category-option').forEach((btn) => {
        btn.classList.toggle('selected', btn.dataset.category === editingCategoryValue);
      });
    }

    function selectCategoryOption(category) {
      if (!categoryLabels[category]) return;
      editingCategoryValue = category;
      renderCategoryOptions();
    }

    async function saveCategory() {
      if (!editingCategoryGroup) return;
      const category = editingCategoryValue;
      $('categorySaveBtn').disabled = true;
      setStatus(`Saving ${categoryLabels[category]} category...`);
      try {
        const res = await fetch(`/api/accounts/${accountId}/groups/${encodeURIComponent(editingCategoryGroup.id)}/category`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ category, groupName: editingCategoryGroup.name })
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Unable to save category');
        groups = groups.map((group) => (
          group.id === editingCategoryGroup.id
            ? { ...group, category: data.category }
            : group
        ));
        if (selectedGroup && selectedGroup.id === editingCategoryGroup.id) {
          selectedGroup = groups.find((group) => group.id === editingCategoryGroup.id) || selectedGroup;
          $('selectedMeta').textContent = `${groupDisplayId(selectedGroup)} | ${groupTypeLabel(selectedGroup)} | ${selectedParticipants.length} contacts | ${selectedGroup.isAdmin ? 'Admin access' : 'View only'}`;
        }
        closeCategoryModal();
        renderGroups();
        setStatus(`${editingCategoryGroup?.name || 'Group'} category saved`, 'ok');
      } finally {
        $('categorySaveBtn').disabled = false;
      }
    }

    function addCreateGroupNumber() {
      const phone = normalizePhone($('createGroupNumber').value);
      if (!phone) {
        setStatus('Enter a valid number', 'error');
        return;
      }
      if (!createGroupNumbers.some((item) => item.phone === phone)) {
        createGroupNumbers.push({
          phone,
          makeAdmin: $('createGroupAdminToggle').checked
        });
      }
      $('createGroupNumber').value = '';
      $('createGroupAdminToggle').checked = false;
      renderCreateGroupNumbers();
      $('createGroupNumber').focus();
    }

    function removeCreateGroupNumber(phone) {
      createGroupNumbers = createGroupNumbers.filter((item) => item.phone !== phone);
      renderCreateGroupNumbers();
    }

    function toggleCreateGroupAdmin(phone, checked) {
      createGroupNumbers = createGroupNumbers.map((item) => (
        item.phone === phone ? { ...item, makeAdmin: checked } : item
      ));
      renderCreateGroupNumbers();
    }

    function renderCreateGroupNumbers() {
      const list = $('createGroupNumbers');
      if (!createGroupNumbers.length) {
        list.innerHTML = '<div class="hint">Add one or more mobile numbers.</div>';
        return;
      }
      list.innerHTML = createGroupNumbers.map((item) => `
        <div class="number-chip">
          <span>${escapeHtml(item.phone)}</span>
          <label>
            <input class="create-admin-toggle" type="checkbox" data-number="${escapeHtml(item.phone)}" ${item.makeAdmin ? 'checked' : ''}>
            Admin
          </label>
          <button class="danger create-remove-number" data-number="${escapeHtml(item.phone)}">Remove</button>
        </div>
      `).join('');
      list.querySelectorAll('.create-admin-toggle').forEach((input) => {
        input.addEventListener('change', () => toggleCreateGroupAdmin(input.dataset.number, input.checked));
      });
      list.querySelectorAll('.create-remove-number').forEach((btn) => {
        btn.addEventListener('click', () => removeCreateGroupNumber(btn.dataset.number));
      });
    }

    async function createGroup() {
      const name = String($('createGroupName').value || '').trim();
      const typedPhone = normalizePhone($('createGroupNumber').value);
      const participantItems = [...createGroupNumbers];
      if (typedPhone && !participantItems.some((item) => item.phone === typedPhone)) {
        participantItems.push({
          phone: typedPhone,
          makeAdmin: $('createGroupAdminToggle').checked
        });
      }
      const participants = participantItems.map((item) => item.phone);
      const adminParticipants = participantItems
        .filter((item) => item.makeAdmin)
        .map((item) => item.phone);
      if (!name) {
        setStatus('Enter group name', 'error');
        return;
      }
      if (!participants.length) {
        setStatus('Add at least one number', 'error');
        return;
      }

      $('createGroupSubmitBtn').disabled = true;
      setStatus(`Creating ${name}...`);
      try {
        const res = await fetch(`/api/accounts/${accountId}/groups/create`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, participants, adminParticipants })
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'Unable to create group');
        closeCreateGroupModal();
        await loadGroups();
        if (data.groupId) {
          await selectGroup(data.groupId);
        }
        setStatus(`${name} created`, 'ok');
      } finally {
        $('createGroupSubmitBtn').disabled = false;
      }
    }

    async function loadGroups() {
      setStatus('Loading groups...');
      const res = await fetch(`/api/accounts/${accountId}/live-groups`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Unable to load groups');
      groups = (data.items || []).map((group) => ({
        ...group,
        category: categoryLabels[group.category] ? group.category : 'internal',
        participants: group.participants || [],
        participantCount: group.participantCount || (group.participants || []).length
      }));
      renderGroups();
      const counts = groups.reduce((acc, group) => {
        const type = groupType(group);
        acc[type] = (acc[type] || 0) + 1;
        return acc;
      }, {});
      setStatus(`Loaded ${groups.length} groups (${counts.client || 0} client, ${counts.internal || 0} internal, ${counts.vacancy || 0} vacancy, ${counts.vendor || 0} vendor, ${data.adminCount || 0} admin)`, 'ok');
    }

    async function selectGroup(groupId) {
      selectedGroup = groups.find((group) => group.id === groupId) || { id: groupId, name: groupId };
      $('selectedTitle').textContent = selectedGroup.name;
      selectedParticipants = selectedGroup.participants || [];
      selectedGroupSearch = '';
      displayedParticipants = selectedParticipants;
      $('selectedMeta').textContent = `${groupDisplayId(selectedGroup)} | ${groupTypeLabel(selectedGroup)} | ${selectedParticipants.length} contacts | ${selectedGroup.isAdmin ? 'Admin access' : 'View only'}`;
      $('addContactBtn').disabled = !selectedGroup.isAdmin;
      $('addContactInput').disabled = !selectedGroup.isAdmin;
      renderGroups();
      renderParticipants();
      setStatus('Participants loaded from live WhatsApp account', 'ok');
    }

    async function addParticipant() {
      if (!selectedGroup) {
        setStatus('Select a group first', 'error');
        return;
      }
      if (!selectedGroup.isAdmin) {
        setStatus('Add contact allowed only in admin groups', 'error');
        return;
      }
      const phone = normalizePhone($('addContactInput').value);
      if (!phone) {
        setStatus('Enter a valid number', 'error');
        return;
      }
      setStatus(`Adding ${phone}...`);
      const res = await fetch(`/api/accounts/${accountId}/groups/${encodeURIComponent(selectedGroup.id)}/participants/add`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone })
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'Unable to add contact');
      $('addContactInput').value = '';
      await loadGroups();
      await selectGroup(selectedGroup.id);
      setStatus(`${phone} add request sent`, 'ok');
    }

    async function removeParticipant(phone) {
      if (!selectedGroup) return;
      if (!selectedGroup.isAdmin) {
        setStatus('Remove contact allowed only in admin groups', 'error');
        return;
      }
      const normalized = normalizePhone(phone);
      if (!normalized) return;
      setStatus(`Removing ${normalized}...`);
      const res = await fetch(`/api/accounts/${accountId}/groups/${encodeURIComponent(selectedGroup.id)}/participants/remove`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: normalized })
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'Unable to remove contact');
      await loadGroups();
      await selectGroup(selectedGroup.id);
      setStatus(`${normalized} remove request sent`, 'ok');
    }

    async function applySearch() {
      activeSearchRaw = String($('searchInput').value || '').trim();
      const digits = activeSearchRaw.replace(/\D+/g, '');
      activeSearch = normalizePhone(activeSearchRaw);
      activeSearchMode = digits.length >= 6 ? 'number' : 'text';

      if (!activeSearchRaw) {
        clearSearch();
        return;
      }
      if (activeSearchMode === 'text') {
        const matched = filterGroupsByType(groups).filter((group) => groupMatchesText(group, activeSearchRaw));
        renderGroups();
        setStatus(`${matched.length} group(s) matched "${activeSearchRaw}"`, matched.length ? 'ok' : 'error');
        if (matched.length === 1) {
          await selectGroup(matched[0].id);
        }
        return;
      }

      setStatus(`Searching ${activeSearch}...`);
      const matched = filterGroupsByType(groups).filter((group) => groupHasNumber(group, activeSearch));
      renderGroups();
      renderParticipants();
      setStatus(`${activeSearch} found in ${matched.length} group(s)`, matched.length ? 'ok' : 'error');
      if (matched.length) await selectGroup(matched[0].id);
    }

    function searchSelectedGroup() {
      if (!selectedGroup) {
        setStatus('Select a group first', 'error');
        return;
      }
      selectedGroupSearch = normalizePhone($('groupSearchInput').value);
      if (!selectedGroupSearch) {
        displayedParticipants = selectedParticipants;
        renderParticipants();
        setStatus('Enter a valid number', 'error');
        return;
      }
      const matched = selectedParticipants.filter((p) => normalizePhone(p.number) === selectedGroupSearch);
      const rest = selectedParticipants.filter((p) => normalizePhone(p.number) !== selectedGroupSearch);
      displayedParticipants = [...matched, ...rest];
      renderParticipants();
      setStatus(`${selectedGroupSearch} ${matched.length ? 'found' : 'not found'} in ${selectedGroup.name}`, matched.length ? 'ok' : 'error');
    }

    function clearSearch() {
      activeSearch = '';
      activeSearchMode = '';
      activeSearchRaw = '';
      $('searchInput').value = '';
      renderGroups();
      renderParticipants();
      setStatus('Search cleared', 'ok');
    }

    function applyGroupTypeFilter() {
      groupTypeFilter = $('groupTypeFilter').value;
      renderGroups();
      const visibleCount = filterGroupsByType(groups).length;
      setStatus(`${visibleCount} ${groupTypeFilter === 'all' ? 'group(s)' : `${groupTypeFilter} group(s)`} visible`, 'ok');
    }

    $('searchBtn').addEventListener('click', () => applySearch().catch((err) => setStatus(err.message, 'error')));
    $('groupTypeFilter').addEventListener('change', applyGroupTypeFilter);
    $('makeGroupBtn').addEventListener('click', openCreateGroupModal);
    $('createGroupCancelBtn').addEventListener('click', closeCreateGroupModal);
    $('createGroupAddNumberBtn').addEventListener('click', addCreateGroupNumber);
    $('createGroupSubmitBtn').addEventListener('click', () => createGroup().catch((err) => setStatus(err.message, 'error')));
    $('categoryCancelBtn').addEventListener('click', closeCategoryModal);
    $('categorySaveBtn').addEventListener('click', () => saveCategory().catch((err) => setStatus(err.message, 'error')));
    document.querySelectorAll('.category-option').forEach((btn) => {
      btn.addEventListener('click', () => selectCategoryOption(btn.dataset.category));
    });
    $('createGroupModal').addEventListener('click', (event) => {
      if (event.target === $('createGroupModal')) closeCreateGroupModal();
    });
    $('categoryModal').addEventListener('click', (event) => {
      if (event.target === $('categoryModal')) closeCategoryModal();
    });
    $('addContactBtn').addEventListener('click', () => addParticipant().catch((err) => setStatus(err.message, 'error')));
    $('groupSearchBtn').addEventListener('click', searchSelectedGroup);
    $('searchInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') applySearch().catch((err) => setStatus(err.message, 'error'));
    });
    $('groupSearchInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') searchSelectedGroup();
    });
    $('addContactInput').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') addParticipant().catch((err) => setStatus(err.message, 'error'));
    });
    $('createGroupNumber').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') addCreateGroupNumber();
    });
    $('createGroupName').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') $('createGroupNumber').focus();
    });

    $('addContactBtn').disabled = true;
    $('addContactInput').disabled = true;
    loadGroups().catch((err) => setStatus(err.message, 'error'));
  </script>
</body>
</html>
